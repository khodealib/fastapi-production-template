stages:
  - lint
  - test
  - build

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/uv

# ---------------------------------------------------------------------------
# Lint & Format
# ---------------------------------------------------------------------------
lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:python{{ cookiecutter.python_version }}-bookworm
  before_script:
    - uv sync
  script:
    - uv run ruff check {{ cookiecutter.package_name }} tests
    - uv run ruff format --check {{ cookiecutter.package_name }} tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

typecheck:
  stage: lint
  image: ghcr.io/astral-sh/uv:python{{ cookiecutter.python_version }}-bookworm
  before_script:
    - uv sync
  script:
    - uv run mypy --strict {{ cookiecutter.package_name }} tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test:
  stage: test
  image: ghcr.io/astral-sh/uv:python{{ cookiecutter.python_version }}-bookworm
  services:
    - name: postgres:16
      alias: db
      variables:
        POSTGRES_USER: app
        POSTGRES_PASSWORD: app
        POSTGRES_DB: test
    - name: redis:7
      alias: redis
  variables:
    DATABASE_URL: postgresql+asyncpg://app:app@db:5432/test
    REDIS_URL: redis://redis:6379/0
    RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
    SECRET_KEY: ci-test-secret-key-at-least-32-bytes
    ENVIRONMENT: test
  before_script:
    - uv sync
  script:
    - uv run alembic upgrade head
    - uv run pytest -v --tb=short
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ---------------------------------------------------------------------------
# Docker Build
# ---------------------------------------------------------------------------
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - docker build -t $CI_PROJECT_NAME:$CI_COMMIT_SHA .
    - docker tag $CI_PROJECT_NAME:$CI_COMMIT_SHA $CI_PROJECT_NAME:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ---------------------------------------------------------------------------
# Docker Push (main/dev only, after all jobs pass)
# ---------------------------------------------------------------------------
push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_success
    - when: never
