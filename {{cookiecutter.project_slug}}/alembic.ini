# A generic, single database configuration for the app.

[alembic]
script_location = app/alembic
prepend_sys_path = .
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(slug)s
# sqlalchemy.url is deliberately unset: app/config/settings.py DATABASE_URL wins.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
