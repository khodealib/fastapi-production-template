[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
authors = [
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
]
dependencies = [
{% if cookiecutter.fastapi_version == "latest" %}
    "fastapi[standard]>=0.115",
{% else %}
    "fastapi[standard]>={{ cookiecutter.fastapi_version.split('.')[0] }}.{{ cookiecutter.fastapi_version.split('.')[1] }},<{{ cookiecutter.fastapi_version.split('.')[0] }}.{{ cookiecutter.fastapi_version.split('.')[1] | int + 1 }}",
{% endif %}
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "sqladmin>=0.20",
    "jinja2>=3.1",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "redis>=5.0",
    "structlog>=24.1",
    "limits>=3.10",
    "typer>=0.12",
    "babel>=2.14",
    "itsdangerous>=2.2",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=0.9",
    "opentelemetry-sdk>=1.0",
    "opentelemetry-instrumentation-fastapi>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-watch>=4.2",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.5",
    "bandit[toml]>=1.7",
    "pytest-xdist>=3.5",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["app"]

[tool.uv]
package = true
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py{{ cookiecutter.python_version.replace('.', '') }}"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "ASYNC",     # flake8-async
    "RET",       # flake8-return
    "ARG",       # flake8-unused-arguments
    "RUF",       # ruff-specific
    "BLE",       # flake8-blind-except
]
ignore = [
    "B008",      # Function call in default argument (Depends() is idiomatic)
    "RET505",    # unnecessary else-after-return
    "RUF012",    # mutable class attributes are the SQLAdmin view API
]

[tool.ruff.lint.per-file-ignores]
"app/alembic/versions/*.py" = ["I", "UP", "SIM", "E501", "W"]
# Models are imported for their side effect: registering tables on the metadata.
"app/alembic/env.py" = ["F401"]
"app/config/settings.py" = ["E501"]
"app/health/checks.py" = ["ASYNC109", "BLE001"]
"app/application.py" = ["ARG001"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
# Pin the app package as first-party so import order does not depend on how the
# generated package name happens to sort against third-party distributions.
known-first-party = ["app"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "sqlalchemy.orm.DeclarativeBase",
    "sqlalchemy.orm.MappedAsDataclass",
]
runtime-evaluated-decorators = [
    "pydantic.validators.validator",
    "pydantic.field_validator",
    "pydantic.model_validator",
    "sqlalchemy.orm.mapped_column",
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------
[tool.bandit]
# Tests are excluded: `assert` is their whole point (B101), and fixture
# credentials are meant to be literals. Only shipped code is scanned.
exclude_dirs = ["tests", "docs", ".venv"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = ["app", "tests"]
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "taskiq.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "taskiq_redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.middleware.rate_limit_headers",
    "app.middleware.request_context",
    "app.modules.users.admin",
    "app.http.pagination",
    "app.alembic.env",
]
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "app.http.response"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = [
    "app.infrastructure.broker",
    "app.infrastructure.scheduler",
    "app.modules.*.tasks.*",
    "app.modules.*.crons.*",
]
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["test_ratelimit", "test_health"]
disable_error_code = ["no-untyped-def", "arg-type"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:alembic.*",
]
